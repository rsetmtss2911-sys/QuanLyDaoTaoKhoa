spring.application.name=qldtkhoa-app

# Tự động nạp biến từ file application-local.properties (nếu có trên máy)
spring.config.import=optional:classpath:application-local.properties

# 1. Kết nối SQL Server (Lấy trực tiếp các biến từ application-local.properties)
spring.datasource.url=jdbc:sqlserver://${db.host:localhost}:${db.port:1433};databaseName=${db.name:App_QLDTKhoa};encrypt=true;trustServerCertificate=true
spring.datasource.username=${db.username:sa}
spring.datasource.password=${db.password:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. Cấu hình JPA / Hibernate (Giữ nguyên tên bảng/cột PascalCase của SQL Server)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 3. Giao diện Thymeleaf, Ngôn ngữ Tiếng Việt & Bảo mật thông báo lỗi (Spring Boot 4.1)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=vi_VN
spring.web.locale-resolver=fixed
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# 4. Tham số quy chế học vụ (Ánh xạ vào class AcademicPolicy)
app.academic.pass-score=4.0
app.academic.min-credits-per-term=14
app.academic.max-credits-per-term=25
app.academic.registration-window-days=14
app.academic.withdraw-deadline-days=21