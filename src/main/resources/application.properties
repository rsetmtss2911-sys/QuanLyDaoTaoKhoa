spring.application.name=qldtkhoa-app

# Nạp biến kết nối local từ thư mục ngoài classpath (không đóng gói vào file .jar)
spring.config.import=optional:file:./config/application-local.properties

# 1. Kết nối SQL Server (lockTimeout=3000 giúp tránh treo chờ khóa dòng ở PESSIMISTIC_WRITE)
spring.datasource.url=jdbc:sqlserver://${db.host:localhost}:${db.port:1433};databaseName=${db.name:App_QLDTKhoa};encrypt=true;trustServerCertificate=true;lockTimeout=3000
spring.datasource.username=${db.username:sa}
spring.datasource.password=${db.password:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. Cấu hình JPA / Hibernate (Schema-first: kiểm tra khớp 21 bảng + 2 Views khi khởi động)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 3. Giao diện Thymeleaf, Ngôn ngữ Tiếng Việt & Bảo mật thông báo lỗi
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=vi_VN
spring.web.locale-resolver=fixed
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# 4. Bảo mật Session Cookie & Chống DoS phân trang
server.servlet.session.timeout=60m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.data.web.pageable.max-page-size=100

# 5. Tham số quy chế học vụ (Ánh xạ vào class AcademicPolicy)
app.academic.pass-score=4.0
app.academic.min-credits-per-term=14
app.academic.max-credits-per-term=25
app.academic.registration-window-days=14
app.academic.withdraw-deadline-days=21
app.academic.gpa-repeat-policy=HIGHEST
app.academic.min-section-students=5
app.academic.decision-sync-cron=0 5 0 * * *
# [TIMEZONE NOTE - GATE 3d] Khớp với múi giờ vận hành Việt Nam (UTC+7).
# Khi deploy trên server UTC, giữ nguyên giá trị Asia/Ho_Chi_Minh ở Java và chuyển comment dòng @Today trong sql/Patch_v3_App_QLDTKhoa.sql.
app.academic.timezone=Asia/Ho_Chi_Minh
app.scheduling.enabled=true
