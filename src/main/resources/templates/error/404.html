<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
  <title>Không tìm thấy trang (404) · QLĐT Khoa</title>
</head>
<body>
<main id="main" class="qd-main text-center py-5" tabindex="-1">
  <div class="mb-4">
    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning bg-opacity-10 text-warning p-4" style="width: 80px; height: 80px;">
      <i class="bi bi-question-circle fs-1 text-warning"></i>
    </div>
  </div>
  <h1 class="qd-h1 mb-3">404 - Không tìm thấy dữ liệu</h1>
  <p class="text-muted mx-auto mb-4" style="max-width: 500px;"
     th:text="${errorMessage != null and !#strings.isEmpty(errorMessage)} ? ${errorMessage} : 'Đường dẫn bạn yêu cầu không tồn tại hoặc bản ghi đã bị thay đổi, gỡ bỏ khỏi hệ thống.'">
    Không tìm thấy dữ liệu.
  </p>
  <div>
    <a class="btn btn-primary" th:href="@{/}">
      <i class="bi bi-house-door me-1"></i> Quay về trang chủ
    </a>
  </div>
</main>
</body>
</html>
