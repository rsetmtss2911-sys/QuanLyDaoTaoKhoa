        </ul>

        <div class="qd-nav-group-title">Học vụ & Giám sát đào tạo</div>
        <ul class="list-unstyled mb-3">
          <li th:replace="~{fragments/sidebar :: item('/admin/nganh-hoc', 'journal-bookmark', 'Ngành đào tạo')}"></li>
          <li th:replace="~{fragments/sidebar :: item('/admin/khoa-nhap-hoc', 'calendar-range', 'Khóa nhập học')}"></li>
          <li th:replace="~{fragments/sidebar :: item('/admin/hoc-ky', 'clock-history', 'Học kỳ năm học')}"></li>

          <li th:replace="~{fragments/sidebar :: item('/admin/lop-hanh-chinh', 'people', 'Lớp hành chính')}"></li>

          <li th:replace="~{fragments/sidebar :: item('/admin/lop-hoc-phan', 'calendar3', 'Lớp học phần')}"></li>
          <li th:replace="~{fragments/sidebar :: item('/admin/xep-lich', 'calendar-week', 'Xếp lịch giảng dạy')}"></li>
          <li th:replace="~{fragments/sidebar :: item('/admin/quyet-dinh', 'file-earmark-text', 'Quyết định học vụ')}"></li>
        </ul>
      </div>

      <!-- ================= PHÒNG ĐÀO TẠO ================= -->
      <div sec:authorize="hasRole('PHONG_DAO_TAO')">
        <ul class="list-unstyled mb-3">
          <li th:replace="~{fragments/sidebar :: item('/admin/dashboard', 'grid-1x2-fill', 'Bàn làm việc')}"></li>
        </ul>

        <div class="qd-nav-group-title">Chương trình & Môn học</div>
        <ul class="list-unstyled mb-3">
          <li th:replace="~{fragments/sidebar :: item('/admin/nganh-hoc', 'journal-bookmark', 'Ngành đào tạo')}"></li>
          <li th:replace="~{fragments/sidebar :: item('/admin/khoa-nhap-hoc', 'calendar-range', 'Khóa tuyển sinh')}"></li>
          <li th:replace="~{fragments/sidebar :: item('/admin/hoc-ky', 'clock-history', 'Học kỳ năm học')}"></li>
          <li th:replace="~{fragments/sidebar :: item('/admin/mon-hoc', 'book', 'Môn học & Tiên quyết')}"></li>
          <li th:replace="~{fragments/sidebar :: item('/admin/ctdt', 'diagram-2', 'Khung CTĐT')}"></li>
        </ul>

        <ul class="list-unstyled mb-3">
          <li th:replace="~{fragments/sidebar :: item('/admin/lop-hanh-chinh', 'people', 'Lớp hành chính')}"></li>

          <li th:replace="~{fragments/sidebar :: item('/admin/khoa', 'building', 'Khoa (Chỉ xem)')}"></li>

          <li th:replace="~{fragments/sidebar :: item('/giang-vien/dashboard', 'grid-1x2-fill', 'Bàn làm việc')}"></li>

    </nav>

    <!-- Footer khi chưa đăng nhập (Khách / Anonymous) -->
    <div sec:authorize="!isAuthenticated()" class="pt-3 border-top border-secondary border-opacity-25 mt-auto px-2 pb-2">
      <a class="btn btn-sm btn-outline-light w-100 py-2 d-flex align-items-center justify-content-center gap-2" th:href="@{/login}">
        <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
      </a>
    </div>

  </div>
</aside>

<!-- Fragment item menu điều hướng -->
<li th:fragment="item(path, icon, label)" xmlns:th="http://www.thymeleaf.org">
  <a class="qd-nav-link" th:href="@{${path}}"
     th:classappend="${currentPath != null and path != null and (currentPath.equals(path) or currentPath.startsWith(path + '/'))} ? 'is-active'"
     th:attr="aria-current=${currentPath != null and path != null and (currentPath.equals(path) or currentPath.startsWith(path + '/'))} ? 'page' : null">
    <i class="bi" th:classappend="'bi-' + ${icon}" aria-hidden="true"></i>
    <span th:text="${label}">Mục</span>
  </a>
</li>
