<span th:fragment="badge(label)" class="qd-status" xmlns:th="http://www.thymeleaf.org"
      th:if="${label != null}"
      th:classappend="'qd-status--' + ${@statusBadge.variant(label)}">
  <i class="bi" th:classappend="${@statusBadge.icon(label)}" aria-hidden="true"></i>
  <span th:text="${label}">Hợp lệ</span>
</span>

<!-- Fragment chuyên biệt cho trạng thái Sinh viên (hỗ trợ cả Enum và chuỗi) -->
<span th:fragment="studentStatus(status)" class="qd-status" xmlns:th="http://www.thymeleaf.org"
      th:if="${status != null}"
      th:classappend="'qd-status--' + ${@statusBadge.variant(status)}">
  <i class="bi" th:classappend="${@statusBadge.icon(status)}" aria-hidden="true"></i>
  <span th:text="${@statusBadge.label(status)}">Đang học</span>
</span>
