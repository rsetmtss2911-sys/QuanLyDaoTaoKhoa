<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
  <title>Quản lý Khoa · QLĐT Khoa</title>
</head>
<body>
<main id="main" class="qd-main" tabindex="-1">
  <div th:replace="~{fragments/flash :: flash}"></div>

  <!-- Header -->
  <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
    <div>
      <nav aria-label="Đường dẫn">
        <ol class="breadcrumb mb-1">
          <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
          <li class="breadcrumb-item active" aria-current="page">Khoa</li>
        </ol>
      </nav>
      <h1 class="qd-h1 mb-0">Danh sách Khoa đào tạo</h1>
    </div>
    <div sec:authorize="hasRole('ADMIN')">
      <a class="btn btn-primary shadow-sm" th:href="@{/admin/khoa/new}">
        <i class="bi bi-plus-lg me-1"></i> Thêm khoa mới
      </a>
    </div>
  </div>

  <!-- Panel Bảng dữ liệu -->
  <div class="qd-panel">
    <!-- Toolbar tìm kiếm -->
    <form method="get" th:action="@{/admin/khoa}" class="p-3 border-bottom d-flex flex-wrap gap-2 align-items-center" role="search">
      <div class="input-group qd-search">
        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
        <label for="q" class="visually-hidden">Tìm kiếm</label>
        <input id="q" name="q" type="search" class="form-control border-start-0 ps-0"
               th:value="${q}" placeholder="Tìm theo mã hoặc tên khoa...">
      </div>
      <button class="btn btn-outline-secondary" type="submit">Tìm kiếm</button>
      <a th:if="${q != null and !q.isEmpty()}" class="btn btn-link text-decoration-none" th:href="@{/admin/khoa}">
        Xóa tìm kiếm
      </a>
    </form>

    <!-- Data Table -->
    <div class="table-responsive">
      <table class="table qd-table">
        <caption class="visually-hidden">Quản lý Khoa</caption>
        <thead>
          <tr>
            <th scope="col" class="qd-col-140">Mã khoa</th>
            <th scope="col">Tên khoa đào tạo</th>
            <th scope="col" class="qd-num qd-col-140">Năm TL</th>
            <th scope="col" class="text-center qd-col-120">Bộ môn</th>
            <th scope="col" class="text-center qd-col-120">Ngành học</th>
            <th scope="col" class="text-end qd-col-180">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${page.empty}">
            <td colspan="6" class="text-center text-muted py-4">
              <i class="bi bi-inbox me-2"></i>Chưa có khoa nào phù hợp
            </td>
          </tr>
          <tr th:each="row : ${page.content}">
            <td>
              <span class="badge bg-light text-dark border font-monospace" th:text="${row.maKhoa}">FIT</span>
            </td>
            <td>
              <a class="fw-semibold text-decoration-none text-dark" th:href="@{/admin/khoa/{id}(id=${row.maKhoa})}" th:text="${row.tenKhoa}">
                Công nghệ thông tin
              </a>
            </td>
            <td class="qd-num" th:text="${row.namThanhLap != null ? row.namThanhLap : '-'}">2005</td>
            <td class="text-center">
              <span class="badge bg-primary bg-opacity-10 text-primary px-2" th:text="${row.soBoMon}">2</span>
            </td>
            <td class="text-center">
              <span class="badge bg-success bg-opacity-10 text-success px-2" th:text="${row.soNganh}">3</span>
            </td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-secondary me-1" th:href="@{/admin/khoa/{id}(id=${row.maKhoa})}" title="Xem chi tiết" aria-label="Xem chi tiết">
                <i class="bi bi-eye"></i>
              </a>
              <span sec:authorize="hasRole('ADMIN')">
                <a class="btn btn-sm btn-outline-primary me-1" th:href="@{/admin/khoa/{id}/edit(id=${row.maKhoa})}" title="Chỉnh sửa" aria-label="Chỉnh sửa">
                  <i class="bi bi-pencil"></i>
                </a>
                <form class="d-inline" method="post" th:action="@{/admin/khoa/{id}/delete(id=${row.maKhoa})}"
                      th:data-confirm="|Bạn có chắc chắn muốn xóa khoa '${row.tenKhoa}'? Hành động này không thể hoàn tác.|">
                  <button class="btn btn-sm btn-outline-danger" type="submit" title="Xóa khoa" aria-label="Xóa khoa">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Phân trang -->
  <div th:replace="~{fragments/pagination :: pager(${page}, '/admin/khoa', ${q})}"></div>
</main>
</body>
</html>
