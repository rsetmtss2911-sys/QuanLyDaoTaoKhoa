<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
  <title th:text="${isEdit} ? 'Sửa khoa đào tạo · QLĐT Khoa' : 'Thêm khoa đào tạo · QLĐT Khoa'">Thêm khoa</title>
</head>
<body>
<main id="main" class="qd-main" tabindex="-1">
  <div class="mb-4">
    <nav aria-label="Đường dẫn">
      <ol class="breadcrumb mb-1">
        <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/khoa}">Khoa</a></li>
        <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit} ? 'Chỉnh sửa' : 'Thêm mới'">Thêm mới</li>
      </ol>
    </nav>
    <h1 class="qd-h1 mb-0" th:text="${isEdit} ? 'Chỉnh sửa thông tin khoa' : 'Thêm mới khoa đào tạo'">Thêm khoa mới</h1>
  </div>

  <div class="row">
    <div class="col-lg-7 col-md-9">
      <div class="qd-panel p-4">
        <form th:action="${isEdit} ? @{/admin/khoa/{id}(id=${form.maKhoa})} : @{/admin/khoa}"
              th:object="${form}" method="post" novalidate>

          <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
            <strong>Thông tin nhập liệu chưa hợp lệ. Vui lòng kiểm tra lại:</strong>
            <ul class="mb-0 mt-1 small">
              <li th:each="e : ${#fields.allErrors()}" th:text="${e}">Lỗi</li>
            </ul>
          </div>

          <div class="mb-3">
            <label for="maKhoa" class="form-label">Mã khoa <span class="text-danger">*</span></label>
            <input id="maKhoa" type="text" class="form-control" th:field="*{maKhoa}"
                   th:errorclass="is-invalid" th:readonly="${isEdit}" maxlength="20"
                   placeholder="VD: FIT, DTVT, KKT..." required>
            <div class="form-text" th:if="${!isEdit}">Tối đa 20 ký tự (chữ cái không dấu, số, gạch nối). Khóa cố định sau khi tạo.</div>
            <div class="invalid-feedback" th:errors="*{maKhoa}">Lỗi mã khoa</div>
          </div>

          <div class="mb-3">
            <label for="tenKhoa" class="form-label">Tên khoa đào tạo <span class="text-danger">*</span></label>
            <input id="tenKhoa" type="text" class="form-control" th:field="*{tenKhoa}"
                   th:errorclass="is-invalid" maxlength="100" placeholder="VD: Công nghệ thông tin" required>
            <div class="invalid-feedback" th:errors="*{tenKhoa}">Lỗi tên khoa</div>
          </div>

          <div class="mb-4">
            <label for="namThanhLap" class="form-label">Năm thành lập</label>
            <input id="namThanhLap" type="number" class="form-control qd-input-narrow" th:field="*{namThanhLap}"
                   th:errorclass="is-invalid" min="1900" max="2100" placeholder="VD: 2005">
            <div class="invalid-feedback" th:errors="*{namThanhLap}">Lỗi năm thành lập</div>
          </div>

          <div class="d-flex gap-2 pt-2 border-top">
            <button type="submit" class="btn btn-primary" data-submit-once>
              <i class="bi bi-check-lg me-1"></i> Lưu thông tin
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/khoa}">Hủy bỏ</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
