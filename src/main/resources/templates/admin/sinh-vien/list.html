<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
  <title>Quản lý Hồ sơ Sinh viên · QLĐT Khoa</title>
</head>
<body>
<main id="main" class="qd-main" tabindex="-1">
  <div th:replace="~{fragments/flash :: flash}"></div>

  <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
    <div>
      <nav aria-label="Đường dẫn">
        <ol class="breadcrumb mb-1">
          <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
          <li class="breadcrumb-item active" aria-current="page">Sinh viên</li>
        </ol>
      </nav>
      <h1 class="qd-h1 mb-0">Hồ sơ Sinh viên toàn khoa</h1>
    </div>
    <div sec:authorize="hasAnyRole('ADMIN','PHONG_DAO_TAO')">
      <a class="btn btn-primary shadow-sm" th:href="@{/admin/sinh-vien/new}">
        <i class="bi bi-person-plus me-1"></i> Tiếp nhận sinh viên mới
      </a>
    </div>
  </div>

  <div class="qd-panel">
    <form method="get" th:action="@{/admin/sinh-vien}" class="p-3 border-bottom d-flex flex-wrap gap-2 align-items-center" role="search">
      <div class="input-group qd-search">
        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
        <input id="q" name="q" type="search" class="form-control border-start-0 ps-0"
               th:value="${q}" placeholder="Tìm theo MSSV, họ tên, email...">
      </div>

      <select name="maLopHC" class="form-select w-auto" onchange="this.form.submit()">
        <option value="">-- Tất cả lớp hành chính --</option>
        <option th:each="l : ${lopHanhChinhs}" th:value="${l.maLopHC}" th:text="${l.tenLopHC + ' (' + l.maLopHC + ')'}"
                th:selected="${l.maLopHC == maLopHC}">CNTT2023A</option>
      </select>

      <select name="status" class="form-select w-auto" onchange="this.form.submit()">
        <option value="">-- Tất cả trạng thái --</option>
        <option th:each="st : ${statuses}" th:value="${st.name()}" th:text="${st.label}"
                th:selected="${status != null and st.name() == status.name()}">Đang học</option>
      </select>

      <button class="btn btn-outline-secondary" type="submit">Lọc</button>
      <a th:if="${(q != null and !q.isEmpty()) or (maLopHC != null and !maLopHC.isEmpty()) or (status != null)}"
         class="btn btn-link text-decoration-none" th:href="@{/admin/sinh-vien}">
        Xóa bộ lọc
      </a>
    </form>

    <div class="table-responsive">
      <table class="table qd-table">
        <thead>
          <tr>
            <th scope="col" style="width: 140px;">Mã SV</th>
            <th scope="col">Họ và tên</th>
            <th scope="col">Giới tính</th>
            <th scope="col">Ngày sinh</th>
            <th scope="col">Lớp hành chính</th>
            <th scope="col">Email tài khoản</th>
            <th scope="col" class="text-center" style="width: 130px;">Trạng thái</th>
            <th scope="col" class="text-end" style="width: 160px;">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${page.empty}">
            <td colspan="8" class="text-center text-muted py-4">
              <i class="bi bi-inbox me-2"></i>Chưa tìm thấy sinh viên nào phù hợp
            </td>
          </tr>
          <tr th:each="row : ${page.content}">
            <td>
              <a class="fw-bold font-monospace text-primary text-decoration-none"
                 th:href="@{/admin/sinh-vien/{id}(id=${row.maSV})}"
                 th:text="${row.maSV}">23020001</a>
            </td>
            <td class="fw-semibold text-dark" th:text="${row.hoTen}">Trần Thị Mai</td>
            <td>
              <span th:if="${row.gioiTinh != null}" th:text="${row.gioiTinh.label}">Nữ</span>
              <span th:unless="${row.gioiTinh != null}" class="text-muted">—</span>
            </td>
            <td>
              <span th:if="${row.ngaySinh != null}" th:text="${#temporals.format(row.ngaySinh, 'dd/MM/yyyy')}">15/08/2005</span>
              <span th:unless="${row.ngaySinh != null}" class="text-muted">—</span>
            </td>
            <td>
              <span class="badge bg-light text-dark border" th:text="${row.maLopHC}">CNTT2023A</span>
            </td>
            <td>
              <span class="text-muted small" th:text="${row.email}">mai.tt@vnu.edu.vn</span>
            </td>
            <td class="text-center">
              <span th:replace="~{fragments/status-badge :: studentStatus(${row.trangThaiHienTai})}"></span>
            </td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-info me-1" th:href="@{/admin/sinh-vien/{id}(id=${row.maSV})}" title="Xem hồ sơ">
                <i class="bi bi-person-lines-fill"></i>
              </a>
              <span sec:authorize="hasAnyRole('ADMIN','PHONG_DAO_TAO')">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/sinh-vien/{id}/edit(id=${row.maSV})}" title="Chỉnh sửa">
                  <i class="bi bi-pencil"></i>
                </a>
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div th:replace="~{fragments/pagination :: pager(${page}, '/admin/sinh-vien', ${q})}"></div>
</main>
</body>
</html>
