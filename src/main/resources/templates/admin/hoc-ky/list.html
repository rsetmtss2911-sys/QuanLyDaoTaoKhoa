<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
  <title>Học kỳ năm học · QLĐT Khoa</title>
</head>
<body>
<main id="main" class="qd-main" tabindex="-1">
  <div th:replace="~{fragments/flash :: flash}"></div>

  <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
    <div>
      <nav aria-label="Đường dẫn">
        <ol class="breadcrumb mb-1">
          <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
          <li class="breadcrumb-item active" aria-current="page">Học kỳ</li>
        </ol>
      </nav>
      <h1 class="qd-h1 mb-0">Danh mục Học kỳ năm học</h1>
    </div>
    <div sec:authorize="hasAnyRole('ADMIN','PHONG_DAO_TAO')">
      <a class="btn btn-primary shadow-sm" th:href="@{/admin/hoc-ky/new}">
        <i class="bi bi-plus-lg me-1"></i> Thêm học kỳ mới
      </a>
    </div>
  </div>

  <div class="qd-panel">
    <form method="get" th:action="@{/admin/hoc-ky}" class="p-3 border-bottom d-flex flex-wrap gap-2 align-items-center" role="search">
      <div class="input-group qd-search">
        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
        <label for="q" class="visually-hidden">Tìm kiếm</label>
        <input id="q" name="q" type="search" class="form-control border-start-0 ps-0"
               th:value="${q}" placeholder="Tìm theo mã hoặc tên học kỳ...">
      </div>
      <button class="btn btn-outline-secondary" type="submit">Tìm kiếm</button>
      <a th:if="${q != null and !q.isEmpty()}" class="btn btn-link text-decoration-none" th:href="@{/admin/hoc-ky}">
        Xóa tìm kiếm
      </a>
    </form>

    <div class="table-responsive">
      <table class="table qd-table">
        <caption class="visually-hidden">Học kỳ năm học</caption>
        <thead>
          <tr>
            <th scope="col" class="qd-col-140">Mã học kỳ</th>
            <th scope="col">Tên học kỳ</th>
            <th scope="col" class="text-center qd-col-120">Năm học</th>
            <th scope="col" class="qd-col-150">Ngày bắt đầu</th>
            <th scope="col" class="qd-col-150">Ngày kết thúc</th>
            <th scope="col" class="text-end qd-col-140">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${page.empty}">
            <td colspan="6" class="text-center text-muted py-4">
              <i class="bi bi-inbox me-2"></i>Chưa có học kỳ nào phù hợp
            </td>
          </tr>
          <tr th:each="row : ${page.content}">
            <td>
              <span class="badge bg-light text-dark border font-monospace" th:text="${row.maHK}">HK1_2025</span>
            </td>
            <td class="fw-semibold text-dark" th:text="${row.tenHK}">Học kỳ 1 năm học 2025-2026</td>
            <td class="text-center fw-bold" th:text="${row.namHoc}">2025</td>
            <td class="font-monospace text-muted" th:text="${row.ngayBatDau != null ? #temporals.format(row.ngayBatDau, 'dd/MM/yyyy') : '-'}">01/09/2025</td>
            <td class="font-monospace text-muted" th:text="${row.ngayKetThuc != null ? #temporals.format(row.ngayKetThuc, 'dd/MM/yyyy') : '-'}">15/01/2026</td>
            <td class="text-end text-nowrap">
              <span sec:authorize="hasAnyRole('ADMIN','PHONG_DAO_TAO')">
                <a class="btn btn-sm btn-outline-primary me-1" th:href="@{/admin/hoc-ky/{id}/edit(id=${row.maHK})}" title="Chỉnh sửa" aria-label="Chỉnh sửa">
                  <i class="bi bi-pencil"></i> Sửa
                </a>
                <form class="d-inline" method="post" th:action="@{/admin/hoc-ky/{id}/delete(id=${row.maHK})}"
                      th:data-confirm="|Xóa học kỳ '${row.tenHK}'? Thao tác sẽ bị chặn nếu đã mở lớp học phần.|">
                  <button class="btn btn-sm btn-outline-danger" type="submit" title="Xóa" aria-label="Xóa">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </span>
              <span sec:authorize="!hasAnyRole('ADMIN','PHONG_DAO_TAO')" class="text-muted small">
                Chỉ xem
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div th:replace="~{fragments/pagination :: pager(${page}, '/admin/hoc-ky', ${q})}"></div>
</main>
</body>
</html>
