<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
  <title th:text="${isEdit} ? 'Sửa bộ môn · QLĐT Khoa' : 'Thêm bộ môn mới · QLĐT Khoa'">Thêm bộ môn</title>
</head>
<body>
<main id="main" class="qd-main" tabindex="-1">
  <div class="mb-4">
    <nav aria-label="Đường dẫn">
      <ol class="breadcrumb mb-1">
        <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/bo-mon}">Bộ môn</a></li>
        <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit} ? 'Chỉnh sửa' : 'Thêm mới'">Thêm mới</li>
      </ol>
    </nav>
    <h1 class="qd-h1 mb-0" th:text="${isEdit} ? 'Chỉnh sửa thông tin bộ môn' : 'Thêm mới bộ môn trực thuộc'">Thêm bộ môn</h1>
  </div>

  <div class="row">
    <div class="col-lg-7 col-md-9">
      <div class="qd-panel p-4">
        <form th:action="${isEdit} ? @{/admin/bo-mon/{id}(id=${form.maBoMon})} : @{/admin/bo-mon}"
              th:object="${form}" method="post" novalidate>

          <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
            <strong>Thông tin nhập liệu chưa hợp lệ. Vui lòng kiểm tra lại:</strong>
            <ul class="mb-0 mt-1 small">
              <li th:each="e : ${#fields.allErrors()}" th:text="${e}">Lỗi</li>
            </ul>
          </div>

          <div class="mb-3">
            <label for="maKhoa" class="form-label">Khoa trực thuộc <span class="text-danger">*</span></label>
            <select id="maKhoa" class="form-select" th:field="*{maKhoa}" th:errorclass="is-invalid" required>
              <option value="">-- Chọn khoa trực thuộc --</option>
              <option th:each="k : ${khoas}" th:value="${k.maKhoa}" th:text="${k.tenKhoa}">Khoa CNTT</option>
            </select>
            <div class="invalid-feedback" th:errors="*{maKhoa}">Lỗi khoa</div>
          </div>

          <div class="mb-3">
            <label for="maBoMon" class="form-label">Mã bộ môn <span class="text-danger">*</span></label>
            <input id="maBoMon" type="text" class="form-control" th:field="*{maBoMon}"
                   th:errorclass="is-invalid" th:readonly="${isEdit}" maxlength="20"
                   placeholder="VD: BM_CNPM, BM_HTTT..." required>
            <div class="form-text" th:if="${!isEdit}">Tối đa 20 ký tự. Không thể thay đổi sau khi tạo.</div>
            <div class="invalid-feedback" th:errors="*{maBoMon}">Lỗi mã bộ môn</div>
          </div>

          <div class="mb-4">
            <label for="tenBoMon" class="form-label">Tên bộ môn <span class="text-danger">*</span></label>
            <input id="tenBoMon" type="text" class="form-control" th:field="*{tenBoMon}"
                   th:errorclass="is-invalid" maxlength="100" placeholder="VD: Công nghệ phần mềm" required>
            <div class="invalid-feedback" th:errors="*{tenBoMon}">Lỗi tên bộ môn</div>
          </div>

          <div class="d-flex gap-2 pt-2 border-top">
            <button type="submit" class="btn btn-primary" data-submit-once>
              <i class="bi bi-check-lg me-1"></i> Lưu thông tin
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/bo-mon}">Hủy bỏ</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
