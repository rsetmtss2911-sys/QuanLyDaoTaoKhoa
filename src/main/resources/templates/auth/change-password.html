<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{})}">
<head>
  <title>Đổi mật khẩu · QLĐT Khoa</title>
</head>
<body>
<main id="main" class="qd-main" tabindex="-1">
  <div th:replace="~{fragments/flash :: flash}"></div>

  <div class="mb-4">
    <nav aria-label="Đường dẫn">
      <ol class="breadcrumb mb-1">
        <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Đổi mật khẩu</li>
      </ol>
    </nav>
    <h1 class="qd-h1 mb-0">Đổi mật khẩu cá nhân</h1>
  </div>

  <div class="row">
    <div class="col-lg-6 col-md-8">
      <div class="qd-panel p-4">
        <form th:action="@{/doi-mat-khau}" method="post" th:object="${form}" novalidate>
          <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
            <strong>Vui lòng kiểm tra lại thông tin:</strong>
            <ul class="mb-0 mt-1 small">
              <li th:each="e : ${#fields.allErrors()}" th:text="${e}">Lỗi</li>
            </ul>
          </div>

          <div class="mb-3">
            <label for="matKhauCu" class="form-label">Mật khẩu hiện tại <span class="text-danger">*</span></label>
            <input id="matKhauCu" type="password" class="form-control" th:field="*{matKhauCu}"
                   th:errorclass="is-invalid" required autocomplete="current-password">
            <div class="invalid-feedback" th:errors="*{matKhauCu}">Lỗi</div>
          </div>

          <div class="mb-3">
            <label for="matKhauMoi" class="form-label">Mật khẩu mới <span class="text-danger">*</span></label>
            <input id="matKhauMoi" type="password" class="form-control" th:field="*{matKhauMoi}"
                   th:errorclass="is-invalid" required autocomplete="new-password">
            <div class="form-text">Tối thiểu 6 ký tự.</div>
            <div class="invalid-feedback" th:errors="*{matKhauMoi}">Lỗi</div>
          </div>

          <div class="mb-4">
            <label for="xacNhanMatKhau" class="form-label">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
            <input id="xacNhanMatKhau" type="password" class="form-control" th:field="*{xacNhanMatKhau}"
                   th:errorclass="is-invalid" required autocomplete="new-password">
            <div class="invalid-feedback" th:errors="*{xacNhanMatKhau}">Lỗi</div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" data-submit-once>
              <i class="bi bi-check-lg me-1"></i> Cập nhật mật khẩu
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/}">Quay lại</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
